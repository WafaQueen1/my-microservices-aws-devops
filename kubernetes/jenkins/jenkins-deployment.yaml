# Jenkins Deployment on Kubernetes
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-cluster-role
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["extensions"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-cluster-role
  apiGroup: rbac.authorization.k8s.io
---

---

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-init-scripts
  namespace: jenkins
data:
  disable-csrf.groovy: |
    import jenkins.model.*
    import hudson.security.*
    def instance = Jenkins.getInstance()
    instance.setCrumbIssuer(null)
    instance.save()
    println "CSRF Protection Disabled to fix 403 error"
  setup-k8s-cloud.groovy: |
    import jenkins.model.*
    import org.csanchez.jenkins.plugins.kubernetes.*
    def instance = Jenkins.getInstance()
    def clouds = instance.clouds
    def k8sCloud = clouds.getByName("kubernetes")
    if (k8sCloud == null) {
        println "Creating Kubernetes Cloud configuration..."
        def newK8sCloud = new KubernetesCloud("kubernetes")
        newK8sCloud.setServerUrl("https://kubernetes.default.svc.cluster.local")
        newK8sCloud.setNamespace("jenkins")
        newK8sCloud.setJenkinsUrl("http://jenkins.jenkins.svc.cluster.local:8080")
        clouds.add(newK8sCloud)
        instance.save()
        println "Kubernetes Cloud 'kubernetes' added successfully."
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              name: jnlp
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: init-scripts-csrf
              mountPath: /var/jenkins_home/init.groovy.d/disable-csrf.groovy
              subPath: disable-csrf.groovy
            - name: init-scripts-k8s
              mountPath: /var/jenkins_home/init.groovy.d/setup-k8s-cloud.groovy
              subPath: setup-k8s-cloud.groovy
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: jenkins-home
          emptyDir: {}
        - name: init-scripts-csrf
          configMap:
            name: jenkins-init-scripts
            items:
              - key: disable-csrf.groovy
                path: disable-csrf.groovy
        - name: init-scripts-k8s
          configMap:
            name: jenkins-init-scripts
            items:
              - key: setup-k8s-cloud.groovy
                path: setup-k8s-cloud.groovy
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  type: LoadBalancer
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30100
    - name: jnlp
      port: 50000
      targetPort: 50000
