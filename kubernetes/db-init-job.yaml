apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: ecommerce
spec:
  template:
    spec:
      containers:
        - name: mysql-client
          image: mysql:8.0
          command:
            [
              "sh",
              "-c",
              "mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD < /scripts/init-db.sql",
            ]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          volumeMounts:
            - name: sql-script
              mountPath: /scripts
      volumes:
        - name: sql-script
          configMap:
            name: db-init-script
      restartPolicy: Never
  backoffLimit: 4
